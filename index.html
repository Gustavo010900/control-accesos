<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Accesos</title>

<style>

body{
    background:#f2f2f2;
    font-family:Arial, sans-serif;
    padding:20px;
}

.card{
    background:white;
    max-width:700px;
    margin:auto;
    border-radius:15px;
    padding:25px;
    box-shadow:0px 0px 15px rgba(0,0,0,0.15);
}

.foto{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:12px;
    border:3px solid #ddd;
}

.activo{
    background:#28a745;
    color:white;
    padding:10px;
    border-radius:8px;
    display:inline-block;
    font-weight:bold;
}

.error{
    color:red;
    font-weight:bold;
}

label{
    font-weight:bold;
}

</style>
</head>

<body>

<div class="card">

<h1>Control de Accesos</h1>

<div id="resultado"></div>

</div>

<script>

window.onload = async function(){

const resultado =
document.getElementById("resultado");

try{

const respuesta =
await fetch("empleados.json");

const empleados =
await respuesta.json();

const parametros =
new URLSearchParams(window.location.search);

const folio =
parametros.get("id");

if(!folio){

resultado.innerHTML = `
<h2 style="color:red;">
No se especificó un folio
</h2>
`;

return;
}

if(!empleados[folio]){

resultado.innerHTML = `
<h2 style="color:red;">
Empleado no encontrado
</h2>
`;

return;
}

const emp =
empleados[folio];

const colorClase =
emp.estado === "Activo"
? "activo"
: "inactivo";

resultado.innerHTML = `

<center>

<img
class="foto"
src="fotos/${folio}.png"
onerror="this.src='https://via.placeholder.com/180?text=Sin+Foto'">

<h2>${emp.nombre}</h2>

<h3>${emp.puesto}</h3>

<div class="${colorClase}">
${emp.estado}
</div>

</center>

<hr>

<p><label>Folio:</label> ${folio}</p>

<p><label>Correo:</label> ${emp.correo}</p>

<p><label>Contacto:</label> ${emp.contacto}</p>

<p><label>Site:</label> ${emp.site}</p>

<hr>

<h3>Equipos Asignados</h3>

<p><label>Laptop:</label> ${emp.laptop}</p>

<p><label>Celular:</label> ${emp.celular}</p>

<p><label>Otros:</label> ${emp.otros}</p>

`;

}
catch(error){

resultado.innerHTML = `

<h2 style="color:red;">
Error cargando empleados.json
</h2>

<p>
${error}
</p>

`;

}

}

</script>

</body>
</html>

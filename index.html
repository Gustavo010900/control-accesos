<!DOCTYPE html>
<html lang="es">
    
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Accesos</title>

<style>

body{
    background:#f2f2f2;
    font-family:Arial, sans-serif;
    padding:20px;
    margin:0;
}

.card{
    background:white;
    max-width:700px;
    margin:auto;
    border-radius:15px;
    padding:25px;
    box-shadow:0px 0px 15px rgba(0,0,0,.15);
}

.header{
    background:#003A70;
    padding:15px;
    border-radius:12px 12px 0 0;
    margin:-25px -25px 20px -25px;
}

.logo{
    width:100%;
    max-width:220px;
    display:block;
    margin:0 auto 10px auto;
}

h1{
    text-align:center;
    font-size:clamp(32px,5vw,52px);
    margin-bottom:5px;
}

.subtitulo{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.foto{
    width:100%;
    max-width:250px;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:15px;
    border:4px solid #ddd;
    display:block;
    margin:0 auto 20px auto;
}

.autorizado{
    background:#28a745;
    color:white;
    border:3px solid #28a745;
    font-size:26px;
    font-weight:bold;
    text-align:center;
    padding:15px;
    border-radius:12px;
    margin:20px auto;
    width:90%;
    max-width:500px;
}

.denegado{
    background:#dc3545;
    color:white;
    border:3px solid #dc3545;
    font-size:26px;
    font-weight:bold;
    text-align:center;
    padding:15px;
    border-radius:12px;
    margin:20px auto;
    width:90%;
    max-width:500px;
}

.restringido{
    background:#ffc107;
    color:black;
    border:3px solid #ffc107;
    font-size:26px;
    font-weight:bold;
    text-align:center;
    padding:15px;
    border-radius:12px;
    margin:20px auto;
    width:90%;
    max-width:500px;
}

.estado{
    background:#f5f5f5;
    color:#28a745;
    border:3px solid #28a745;
    font-size:24px;
    font-weight:bold;
    text-align:center;
    padding:12px;
    border-radius:12px;
    margin:20px auto;
    width:90%;
    max-width:220px;
}

.error{
    color:red;
    text-align:center;
}

label{
    font-weight:bold;
}

.info{
    text-align:left;
}

hr{
    margin:25px 0;
}

@media (max-width:600px){

    .card{
        padding:15px;
    }

    .autorizado,
    .denegado,
    .restringido{
        font-size:20px;
    }

    .estado{
        font-size:20px;
    }

}

</style>

</head>

<body>

<div class="card">

<div class="header">

<img
class="logo"
src="logo.png"
alt="logo">

</div>

<h1>CONTROL DE ACCESOS</h1>

<p class="subtitulo">
Sistema de Control de Accesos y Activos
</p>

<div id="resultado"></div>

</div>

<script>

window.onload = async function(){

    const resultado =
    document.getElementById("resultado");

    try{

        const respuesta =
        await fetch("empleados.json?v=" + new Date().getTime());

        const empleados =
        await respuesta.json();

        const parametros =
        new URLSearchParams(window.location.search);

        const folio =
        parametros.get("id");

        if(!folio){

            resultado.innerHTML = `
            <h2 class="error">
            No se especificó un folio
            </h2>
            `;

            return;

        }

        if(!empleados[folio]){

            resultado.innerHTML = `
            <h2 class="error">
            Empleado no encontrado
            </h2>
            `;

            return;

        }

        const emp = empleados[folio];

        let colorClase = "autorizado";
        let mensajeAcceso = "🟢 ACCESO AUTORIZADO";

        if(emp.estado === "Baja"){

            colorClase = "denegado";
            mensajeAcceso = "🔴 ACCESO DENEGADO";

        }

        if(emp.estado === "Suspendido"){

            colorClase = "restringido";
            mensajeAcceso = "🟡 ACCESO RESTRINGIDO";

        }

        resultado.innerHTML = `

        <center>

        <img
        class="foto"
        src="fotos/${folio}.png"
        onerror="this.src='https://via.placeholder.com/250?text=Sin+Foto'">

        <div class="${colorClase}">
            ${mensajeAcceso}
        </div>

        <h2>${emp.nombre}</h2>

        <h3>${emp.puesto}</h3>

        <div class="estado">
            ESTATUS: ${emp.estado}
        </div>

        </center>

        <hr>

        <div class="info">

        <p>🪪 <label>Folio:</label> ${folio}</p>
        
        <p>🏢 <label>Site:</label> ${emp.site}</p>

        </div>

        <hr>

        <h2>Equipos Asignados</h2>

       <p>💻 <label>Laptop:</label> ${emp.laptop}</p>
       
       <p>📱 <label>Celular:</label> ${emp.celular}</p>
       
       <p>🎧 <label>Otros:</label> ${emp.otros}</p>

        `;

    }
    catch(error){

        resultado.innerHTML = `
        <h2 class="error">
        Error cargando empleados.json
        </h2>

        <p>${error}</p>
        `;

        console.error(error);

    }

}

</script>

</body>
</html>

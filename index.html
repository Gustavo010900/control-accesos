<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Accesos</title>

<style>

body{
    background:#f2f2f2;
    font-family:Arial, sans-serif;
    padding:20px;
}

.card{
    background:white;
    max-width:700px;
    margin:auto;
    border-radius:15px;
    padding:25px;
    box-shadow:0px 0px 15px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
}

.foto{
    width:250px;
    height:250px;
    object-fit:cover;
    border-radius:15px;
    border:4px solid #ddd;
    display:block;
    margin:0 auto 20px auto;
}

.autorizado{
    background:#28a745;
    color:white;
    font-size:36px;
    font-weight:bold;
    text-align:center;
    padding:20px;
    border-radius:12px;
    margin:20px 0;
}

.denegado{
    background:#dc3545;
    color:white;
    font-size:36px;
    font-weight:bold;
    text-align:center;
    padding:20px;
    border-radius:12px;
    margin:20px 0;
}

.restringido{
    background:#ffc107;
    color:black;
    font-size:36px;
    font-weight:bold;
    text-align:center;
    padding:20px;
    border-radius:12px;
    margin:20px 0;
}

.estado{
    background:#f5f5f5;
    color:#28a745;
    border:3px solid #28a745;
    font-size:26px;
    font-weight:bold;
    text-align:center;
    padding:12px;
    border-radius:12px;
    margin:20px auto;
    width:220px;
}

.error{
    color:red;
    font-weight:bold;
}

label{
    font-weight:bold;
}

hr{
    margin:25px 0;
}

</style>
</head>

<body>

<div class="card">

<h1>CONTROL DE ACCESOS</h1>

<div id="resultado"></div>

</div>

<script>

window.onload = async function(){

    const resultado =
    document.getElementById("resultado");

    try{

        const respuesta =
        await fetch("empleados.json?v=" + new Date().getTime());

        const empleados =
        await respuesta.json();

        const parametros =
        new URLSearchParams(window.location.search);

        const folio =
        parametros.get("id");

        if(!folio){

            resultado.innerHTML = `
            <h2 class="error">
            No se especificó un folio
            </h2>
            `;
            return;

        }

        if(!empleados[folio]){

            resultado.innerHTML = `
            <h2 class="error">
            Empleado no encontrado
            </h2>
            `;
            return;

        }

        const emp =
        empleados[folio];

        let colorClase = "autorizado";
        let mensajeAcceso = "🟢 ACCESO AUTORIZADO";

        if(emp.estado === "Baja"){

            colorClase = "denegado";
            mensajeAcceso = "🔴 ACCESO DENEGADO";

        }

        if(emp.estado === "Suspendido"){

            colorClase = "restringido";
            mensajeAcceso = "🟡 ACCESO RESTRINGIDO";

        }

        resultado.innerHTML = `

        <center>

            <img
            class="foto"
            src="fotos/${folio}.png"
            onerror="this.src='https://via.placeholder.com/250?text=Sin+Foto'">

            <div class="${colorClase}">
            ${mensajeAcceso}
            </div>

            <h2>${emp.nombre}</h2>

            <h3>${emp.puesto}</h3>

            <div class="estado">
            ${emp.estado}
            </div>

        </center>

        <hr>

        <p><label>Folio:</label> ${folio}</p>

        <p><label>Site:</label> ${emp.site}</p>

        <hr>

        <h2>Equipos Asignados</h2>

        <p><label>Laptop:</label> ${emp.laptop}</p>

        <p><label>Celular:</label> ${emp.celular}</p>

        <p><label>Otros:</label> ${emp.otros}</p>

        `;

    }
    catch(error){

        resultado.innerHTML = `
        <h2 class="error">
        Error cargando empleados.json
        </h2>

        <p>${error}</p>
        `;

        console.error(error);

    }

}

</script>

</body>
</html>
